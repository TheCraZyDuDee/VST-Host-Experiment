name: Linux build

# Only the latest commit of each branch needs a full Linux/Qt/VST3 build.
# A push and the corresponding PR share one cancellation group.
concurrency:
  group: linux-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libpipewire-0.3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  gui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI and audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libpipewire-0.3-dev qt6-base-dev qt6-wayland weston libx11-dev xvfb
      - name: Configure GUI and VST3 support
        run: cmake -S . -B build-gui -DCMAKE_BUILD_TYPE=Release -DVST_HOST_ENABLE_VST3=ON -DVST_HOST_BUILD_GUI=ON
      - name: Build GUI and VST3 host
        run: cmake --build build-gui --parallel 2
      - name: Configure GUI without X11 development libraries
        run: |
          cmake -S . -B build-wayland-no-x11 -DCMAKE_BUILD_TYPE=Release \
            -DVST_HOST_ENABLE_VST3=ON -DVST_HOST_BUILD_GUI=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_X11=ON \
            -DVST3_SDK_ROOT="$PWD/build-gui/_deps/vst3sdk-src"
      - name: Build Wayland-compatible GUI without X11
        run: cmake --build build-wayland-no-x11 --target vst-host-gui --parallel 2
      - name: Smoke-test native Wayland UI on a headless compositor
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/vst-host-wayland"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=vst-host-ci \
            --idle-time=0 --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if [[ -S "$XDG_RUNTIME_DIR/vst-host-ci" ]]; then break; fi
            sleep 0.2
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/vst-host-ci" ]]; then
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          fi
          # A running GUI is expected to stay open until the timeout.
          # Any immediate Qt/Wayland startup failure returns a different code.
          set +e
          QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=vst-host-ci \
            timeout 4s ./build-wayland-no-x11/vst-host-gui \
            > "$RUNNER_TEMP/vst-host-wayland.log" 2>&1
          exit_code=$?
          set -e
          cat "$RUNNER_TEMP/vst-host-wayland.log"
          test "$exit_code" -eq 124
          # The Plug-in UI tab must be accessible on Wayland even without
          # X11 support; the external-window action stays disabled until
          # a compatible plugin editor is actually opened.
          QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=vst-host-ci \
            ./build-wayland-no-x11/vst-host-gui --check-plugin-ui-tab
      - name: Smoke-test XEmbed companion window from native Qt Wayland
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/vst-host-xembed-wayland"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=vst-host-xembed-ci \
            --idle-time=0 --log="$RUNNER_TEMP/weston-xembed.log" &
          weston_pid=$!
          Xvfb :83 -screen 0 1280x800x24 -nolisten tcp \
            > "$RUNNER_TEMP/xvfb-xembed.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" "$weston_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if [[ -S "$XDG_RUNTIME_DIR/vst-host-xembed-ci" && -S /tmp/.X11-unix/X83 ]]; then
              break
            fi
            sleep 0.2
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/vst-host-xembed-ci" || ! -S /tmp/.X11-unix/X83 ]]; then
            cat "$RUNNER_TEMP/weston-xembed.log" "$RUNNER_TEMP/xvfb-xembed.log"
            exit 1
          fi
          # This verifies Xlib parent/window creation with a Wayland Qt app.
          # Third-party Wine/VST editor rendering still needs real desktop tests.
          QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=vst-host-xembed-ci DISPLAY=:83 \
            ./build-gui/vst-host-gui --check-xembed-window
          QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=vst-host-xembed-ci DISPLAY=:83 \
            ./build-gui/vst-host-gui --check-plugin-ui-tab

